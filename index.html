<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pine-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b26" />
    <title>Beamlynx</title>
    <!-- Static, because link previews (X, LinkedIn, Slack) read the HTML
         without running JavaScript, so tags React adds never reach them. -->
    <meta name="description" content="A visual database client for PostgreSQL and MySQL. Click from table to table and the query writes itself." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beamlynx" />
    <meta property="og:title" content="Beamlynx - Click through your database" />
    <meta property="og:description" content="A visual database client. Click from table to table and the query writes itself." />
    <meta property="og:image" content="https://beamlynx.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://beamlynx.com/og-image.png" />
    <style>
      :root {
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'ss01', 'ss02', 'zero';
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p>Please enable JavaScript to use Beamlynx.</p>
    </noscript>
  </body>
</html>
